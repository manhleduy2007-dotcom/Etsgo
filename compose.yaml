services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: etsgo
      POSTGRES_USER: etsgo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etsgo-local-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etsgo"]
      interval: 3s
      retries: 20
  migrate:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://etsgo:${POSTGRES_PASSWORD:-etsgo-local-only}@db:5432/etsgo
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://etsgo:${POSTGRES_PASSWORD:-etsgo-local-only}@db:5432/etsgo
      # Only the localhost port below is published. The container sees Docker's
      # private gateway as the client rather than the host's loopback address.
      DEV_TRUST_DOCKER_GATEWAY: "true"
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://etsgo:${POSTGRES_PASSWORD:-etsgo-local-only}@db:5432/etsgo
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  pgdata:
