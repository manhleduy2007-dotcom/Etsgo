name: Backend and iOS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: etsgo
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: etsgo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U etsgo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://etsgo:test-only@localhost:5432/etsgo_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: ruff check .
      - run: pytest -q
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile iOS simulator app
        run: xcodebuild -project TodoList.xcodeproj -scheme TodoList -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
